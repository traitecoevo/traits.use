url: https://traitecoevo.github.io/traits.use/

home:
  title: Access and wrangle data from traits.build trait databases
  description: Load, explore and wrangle trait databases built with traits.build, such as AusTraits

development:
  mode: release

template:
  bootswatch: litera
  bootstrap: 5
  
reference:
- title: Accessing and exploring the database
- contents:
  - load_austraits
  - load_database
  - starts_with("get_")
  - summarise_database
  - starts_with("lookup_")
  - traits_build_sources

- title: Filter from the database
- contents:
  - starts_with("extract")
  
- title: Join data to traits table
- contents:  
  - starts_with("join")
  
- title: Reshape traits table
- contents:  
  - starts_with("trait_pivot")
  - starts_with("join")
  - ends_with("trait_values")
  
- title: Reshape database(s)
- contents:  
  -  as_wide_table
  - flatten_database
  - bind_databases
  
- title: Quick data visualisations
  desc: Plot site or variance distributions
- contents:
  - starts_with("plot")
  
- title: Helpful functions
- contents:
  - starts_with("convert")
  - print.traits.build
  
navbar:
  structure:
    left:
    - home
    - intro
    - reference
    - news
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    intro:
      text: Get Started
      href: articles/austraits.html

    news:
      text: News
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/traitecoevo/traits.use/
